[project]
name = "Lab1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.11.0",
    "click>=8.3.1",
    "fastapi[standard]>=0.123.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pylint>=4.0.4",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "uvicorn>=0.38.0",
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "cli*", "mylib*", "templates*"]
